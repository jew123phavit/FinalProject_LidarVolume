encoder_node:
  ros__parameters:
    i2c_bus: 1
    home_offset: 819
    publish_rate_hz: 100

integrated_scanner_node:
  ros__parameters:
    step_pin: 23
    dir_pin: 24
    enable_pin: 25

    base_steps_per_rev: 200      # 28BYJ-48 Full Step (2048 step/rev microstepped)
    microstepping: 16            # 1=full-step, 2=half-step
    direction_cw: 1
    direction_ccw: 0

    max_velocity_deg_per_sec: 300.0     # ↓ ลดจาก 200 เพื่อความเรียบ (smooth)
    min_velocity_deg_per_sec: 30.0      # ↓ ลดจาก 20 เพื่อ fine control
    tolerance_deg: 2.0                  # ↑ เพิ่มจาก 1.0 (ลดความไว)
    deceleration_zone_deg: 50.0         # ↑ เพิ่มจาก 30 (ให้ settling นาน)
    settling_time_s: 0.2                # NEW: เวลารอให้มอเตอร์ล็อก
      
    # P-Control Strategy:
    # - ยิ่งไกล target → ความเร็วสูง
    # - ใกล้ target (ภายใน deceleration_zone) → ความเร็วลด
    # - ที่ target ± tolerance → ถือว่า "reached" และ settling
      
    home_angle_deg: 180.0
    start_angle_deg: 90.0               # ขาไป (CCW from home)
    end_angle_deg: 270.0                # ขากลับ (CW from start)
    scan_speed_dps: 120.0                # ↓ ลดจาก 200 (smooth scanning)
    pause_duration_s: 0.5 
    velocity_smoother_alpha: 0.3       # NEW: Smoothing factor for velocity changes
